name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400

      - name: Restore
        run: dotnet restore .\LocalWhale.slnx

      - name: Test core
        run: dotnet test .\tests\LocalWhale.Core.Tests\LocalWhale.Core.Tests.csproj -c Release --no-restore

      - name: Build desktop shell
        run: dotnet build .\src\LocalWhale.App\LocalWhale.App.csproj -c Release --no-restore

  bridge:
    name: Desktop bridge tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          package-manager-cache: false

      - name: Test bridge
        working-directory: bridge
        run: npm test
